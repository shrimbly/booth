[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "booth"
version = "0.1.0"
description = "Local Adobe Podcast-style speech enhancement: isolate the voice, clean it, remix with speech/background/music controls."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  # Sidon's results were tested with exactly these; uv.lock pins everything else.
  "torch==2.15.0",
  "transformers==5.21.0",
  "huggingface_hub==2.3.0",
  "numpy>=2.0",
  "scipy>=1.11",
  "demucs>=4.1.0,<5",
  "soundfile>=0.12",
  "rich>=13",
  "onnxruntime>=1.16",   # DeepFilterNet3, Silero VAD (breath removal) and DNSMOS scoring
]

[project.scripts]
booth = "booth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/booth"]

[tool.uv]
# Booth runs on Apple silicon; torch has no Intel Mac builds past 2.2.
environments = ["sys_platform != 'darwin' or platform_machine == 'arm64'"]
