<!doctype html>
<!--
  The link-preview card, site/assets/og.png. Render it at 1200×630, 2×:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --force-device-scale-factor=2 --window-size=1200,630 --virtual-time-budget=3000 \
      --screenshot=site/assets/og.png site/tools/og-card.html

  The popover is docs/images/booth-light.png, which Booth's --render-states draws.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Booth card</title>
<style>
@font-face {
  font-family: "Geist Serif";
  src: url("../assets/GeistSerif-Regular.ttf") format("truetype");
}
:root {
  --paper: #f6f6f4;
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --serif: "Geist Serif", "New York", ui-serif, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  display: grid;
  grid-template-columns: 1fr 372px;
  align-items: center;
  gap: 64px;
  padding: 0 84px 0 96px;
}
/* The site's name: a soft, faint drawing with a sharp one showing through where it is in focus,
   as when the pointer rests on it. */
.name {
  position: relative;
  margin: 0 0 22px -6px;
  font: 168px/1 var(--serif);
  letter-spacing: -0.05em;
}
.name span { display: block; }
.rest { opacity: 0.4; filter: blur(3.2px); }
.focus {
  position: absolute;
  inset: 0;
  opacity: 0.92;
  filter: blur(0.5px);
  -webkit-mask-image: radial-gradient(ellipse 46% 120% at 34% 58%, #000 30%, transparent 78%);
  mask-image: radial-gradient(ellipse 46% 120% at 34% 58%, #000 30%, transparent 78%);
}
.line {
  margin: 0;
  font-size: 38px;
  line-height: 1.32;
  letter-spacing: -0.012em;
  font-weight: 500;
  max-width: 560px;
  text-wrap: balance;
}
.sub {
  margin: 18px 0 0;
  font-size: 26px;
  line-height: 1.4;
  color: var(--muted);
}
.domain {
  margin: 46px 0 0;
  font: 21px var(--mono);
  color: var(--muted);
  letter-spacing: 0.01em;
}
.popover {
  width: 372px;
  display: block;
  border-radius: 22px;
  box-shadow: 0 34px 70px -18px rgba(29, 29, 31, 0.22), 0 4px 14px rgba(29, 29, 31, 0.07);
}
</style>
</head>
<body>
  <main>
    <h1 class="name" aria-label="Booth"><span class="rest">Booth</span><span class="focus" aria-hidden="true">Booth</span></h1>
    <p class="line">Studio speech for any video or recording, right from your menu bar.</p>
    <p class="sub">Free, open source and 100% local.</p>
    <p class="domain">getbooth.xyz</p>
  </main>
  <img class="popover" src="../../docs/images/booth-light.png" alt="">
</body>
</html>
